<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="MySQL PITR logo">
  <defs>
    <linearGradient id="mc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#863bff"/>
      <stop offset="1" stop-color="#47bfff"/>
    </linearGradient>
    <radialGradient id="mg" cx="0.5" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#7e14ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7e14ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- dark-mode card -->
  <rect width="96" height="96" rx="12" fill="#10131a"/>

  <circle cx="50" cy="52" r="44" fill="url(#mg)"/>
  <!-- M as twin peaks -->
  <path d="M16 76 L40 24 L56 51 L43.5 51 Z" fill="url(#mc)"/>
  <path d="M42 76 L64 30 L82 66 L71 66 L64 49 Z" fill="#863bff" opacity="0.7"/>
