<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="MySQL PITR logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2739"/>
      <stop offset="1" stop-color="#0D1220"/>
    </linearGradient>
  </defs>

  <!-- app-icon tile -->
  <rect x="2" y="2" width="92" height="92" rx="24" fill="url(#bg)"/>

  <!-- binlog entries -->
  <rect x="20" y="30" width="38" height="9" rx="4.5" fill="#3B82F6"/>
  <rect x="20" y="45" width="48" height="9" rx="4.5" fill="#60A5FA"/>
  <rect x="20" y="60" width="30" height="9" rx="4.5" fill="#2563EB"/>

  <!-- rewind chevron -->
  <path d="M72 26 L52 48 L72 70"
        fill="none" stroke="#38BDF8" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- checkpoint on the recovered entry -->
  <circle cx="40" cy="49.5" r="5" fill="#FFFFFF"/>
</svg>
