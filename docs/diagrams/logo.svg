<svg xmlns="http://www.w3.org/2000/svg" width="300" height="96" viewBox="0 0 300 96" role="img" aria-label="MySQL PITR logo">
  <!-- counterclockwise recovery ring with integral arrowhead
       (geometry after Lucide "rotate-ccw", ISC license) -->
  <path d="M12 48a36 36 0 1 0 36-36 39 39 0 0 0-26.96 10.96L12 32"
        fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 12v20h20"
        fill="none" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- database cylinder -->
  <path d="M31 38v20a17 6 0 0 0 34 0V38Z" fill="#2563EB"/>
  <ellipse cx="48" cy="48" rx="17" ry="6" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2"/>
  <ellipse cx="48" cy="38" rx="17" ry="6" fill="#60A5FA"/>

  <!-- wordmark -->
  <text x="104" y="58" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" letter-spacing="0.5">
    <tspan fill="#24292F">MySQL</tspan><tspan fill="#2563EB" dx="9">PITR</tspan>
  </text>
</svg>
